name: Playwright Tests
run-name: PetStore API Playwright Tests

on:
  push:
  
jobs:
  Run-Tests:
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Run Tests
        run: |
             npm ci
             PLAYWRIGHT_JUNIT_OUTPUT_NAME=results.xml npx playwright test --reporter=list,junit

      - name: Create Test Summary
        uses: test-summary/action@dist
        if: success() || failure()
        with:
          paths: results.xml

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Playwright API Tests
          path: results.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload Playwright Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: |
                results.xml
                playwright-report